[preset.0]

name="Web"
platform="Web"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="content/*.json"
exclude_filter="tests/*, playtest/*, scripts/*, assets/*.json"
export_path="../web-build/index.html"
patches=PackedStringArray()
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]

custom_template/debug=""
custom_template/release=""
variant/extensions_support=false
variant/thread_support=false
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=false
html/export_icon=true
html/custom_html_shell=""
html/head_include="<style>#rotate-hint{display:none;position:fixed;inset:0;z-index:10;background:#15120e;color:#f3ead9;font:20px sans-serif;align-items:center;justify-content:center;text-align:center;padding:24px;line-height:1.6}@media (orientation:portrait) and (max-width:900px){#rotate-hint{display:flex}}</style><script>addEventListener('DOMContentLoaded',function(){var d=document.createElement('div');d.id='rotate-hint';d.innerHTML='화면을 가로로 돌려 주세요'+(document.documentElement.requestFullscreen?'<br>여기를 누르면 전체 화면으로 바뀝니다':'');d.onclick=function(){var e=document.documentElement;if(!e.requestFullscreen)return;e.requestFullscreen().then(function(){return screen.orientation.lock('landscape')}).catch(function(){})};document.body.appendChild(d)})</script>"
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
html/experimental_virtual_keyboard=true
progressive_web_app/enabled=false
progressive_web_app/ensure_cross_origin_isolation_headers=false
progressive_web_app/offline_page=""
progressive_web_app/display=1
progressive_web_app/orientation=0
progressive_web_app/icon_144x144=""
progressive_web_app/icon_180x180=""
progressive_web_app/icon_512x512=""
progressive_web_app/background_color=Color(0, 0, 0, 1)
